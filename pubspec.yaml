name: preventivo
description: Preventivi offline-first con Flutter, Clean Architecture e Riverpod 3.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.5.0
  sqflite: ^2.4.6
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5
  file_selector: ^1.1.0
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#000000'
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
